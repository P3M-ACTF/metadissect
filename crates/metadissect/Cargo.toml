[package]
name = "metadissect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Exhaustive metadata parsers, hashes and MIME detection."

[features]
default = ["c2pa"]
# Content Authenticity Initiative SDK (rust_native_crypto; no OpenSSL / no remote fetch).
c2pa = ["dep:c2pa"]
heif = []

[dependencies]
anyhow.workspace = true
base64 = "0.22"
blake3 = "1"
c2pa = { version = "0.90", default-features = false, features = ["rust_native_crypto"], optional = true }
chrono.workspace = true
encoding_rs = "0.8"
flate2 = "1"
goblin = { version = "0.10", default-features = false, features = ["std", "elf32", "elf64", "mach32", "mach64", "pe32", "pe64", "endian_fd"] }
hex = "0.4"
infer = "0.19"
kamadak-exif = "0.6"
lofty = "0.22"
lopdf = "0.42"
md-5 = "0.10"
png = "0.17"
quick-xml = { version = "0.41", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
